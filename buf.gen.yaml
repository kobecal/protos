version: v2
clean: true

plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - module=github.com/kobecal/protos/gen/go
  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - module=github.com/kobecal/protos/gen/go
  - local: protoc-gen-grpc-gateway
    out: gen/go
    opt:
      - module=github.com/kobecal/protos/gen/go
