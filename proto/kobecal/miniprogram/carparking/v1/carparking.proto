// CarParkingService is the front-door contract for the car-parking mini
// program backend (parking lot discovery, favorites, submissions with a
// review flow, and outdated-information reporting).
syntax = "proto3";

package kobecal.miniprogram.carparking.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "kobecal/miniprogram/common/v1/common.proto";

option go_package = "github.com/kobecal/protos/gen/go/miniprogram/carparking/v1;carparkingv1";

// CarParkingService exposes parking lot discovery, favorites, user-submitted
// lots with a review flow, and outdated-information reporting.
service CarParkingService {
  // Ping returns a liveness response.
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {get: "/car-parking/v1/ping"};
  }

  // ListNearbyParkingLots returns approved, enabled parking lots near the
  // caller's location, sorted by distance. Lots with outdated reports are
  // demoted.
  rpc ListNearbyParkingLots(ListNearbyParkingLotsRequest) returns (ListNearbyParkingLotsResponse) {
    option (google.api.http) = {get: "/car-parking/v1/parking-lots:nearby"};
  }

  // CheckCachedParkingLots is the lightweight staleness probe for the mini
  // program's local parking-lot cache. The client sends a snapshot of the
  // lots it cached (id + last-known updated_at); the server returns only the
  // ids whose cached copy is no longer current (content changed, or the lot
  // no longer exists), so the client can drop or refresh them. This keeps
  // the transfer tiny even with 100 cached lots.
  rpc CheckCachedParkingLots(CheckCachedParkingLotsRequest) returns (CheckCachedParkingLotsResponse) {
    option (google.api.http) = {
      post: "/car-parking/v1/parking-lots:check-cached"
      body: "*"
    };
  }

  // ReverseGeocode resolves a coordinate pair into a human-readable parking
  // lot location (POI name, address, city). The server holds the geocoding
  // service credentials; the mini program only sends its coordinates, so the
  // key never leaves the backend.
  rpc ReverseGeocode(ReverseGeocodeRequest) returns (ReverseGeocodeResponse) {
    option (google.api.http) = {
      post: "/car-parking/v1/geocode:reverse"
      body: "*"
    };
  }

  // GetParkingLot returns one parking lot. Pending and rejected lots are only
  // visible to their submitter (and reviewers); disabled lots are only visible
  // to their submitter and users who favorited them.
  rpc GetParkingLot(GetParkingLotRequest) returns (GetParkingLotResponse) {
    option (google.api.http) = {get: "/car-parking/v1/parking-lots/{parking_lot_id}"};
  }

  // CreateParkingLot submits a new parking lot for review. The lot is
  // immediately usable by its submitter and becomes publicly visible once a
  // reviewer approves it.
  rpc CreateParkingLot(CreateParkingLotRequest) returns (CreateParkingLotResponse) {
    option (google.api.http) = {
      post: "/car-parking/v1/parking-lots"
      body: "*"
    };
  }

  // UpdateParkingLot fully replaces a parking lot owned by the caller. Only
  // pending or rejected lots can be edited; editing resubmits the lot for
  // review and resets its outdated_report_count.
  rpc UpdateParkingLot(UpdateParkingLotRequest) returns (UpdateParkingLotResponse) {
    option (google.api.http) = {
      put: "/car-parking/v1/parking-lots/{parking_lot_id}"
      body: "*"
    };
  }

  // DeleteParkingLot deletes a parking lot owned by the caller. Only pending
  // or rejected lots can be deleted; approved lots must be disabled by an
  // admin instead.
  rpc DeleteParkingLot(DeleteParkingLotRequest) returns (DeleteParkingLotResponse) {
    option (google.api.http) = {delete: "/car-parking/v1/parking-lots/{parking_lot_id}"};
  }

  // ListMyParkingLots lists the caller's submissions, including lots awaiting
  // review or rejected.
  rpc ListMyParkingLots(ListMyParkingLotsRequest) returns (ListMyParkingLotsResponse) {
    option (google.api.http) = {get: "/car-parking/v1/my/parking-lots"};
  }

  // ListParkingLotsForReview lists submissions for the admin review queue,
  // newest first. Admin only.
  rpc ListParkingLotsForReview(ListParkingLotsForReviewRequest) returns (ListParkingLotsForReviewResponse) {
    option (google.api.http) = {get: "/car-parking/v1/admin/parking-lots:for-review"};
  }

  // ReviewParkingLot approves or rejects a pending submission. Admin only.
  rpc ReviewParkingLot(ReviewParkingLotRequest) returns (ReviewParkingLotResponse) {
    option (google.api.http) = {
      post: "/car-parking/v1/parking-lots/{parking_lot_id}:review"
      body: "*"
    };
  }

  // FavoriteParkingLot adds an approved parking lot to the caller's favorites.
  rpc FavoriteParkingLot(FavoriteParkingLotRequest) returns (FavoriteParkingLotResponse) {
    option (google.api.http) = {
      post: "/car-parking/v1/parking-lots/{parking_lot_id}:favorite"
      body: "*"
    };
  }

  // UnfavoriteParkingLot removes a parking lot from the caller's favorites.
  rpc UnfavoriteParkingLot(UnfavoriteParkingLotRequest) returns (UnfavoriteParkingLotResponse) {
    option (google.api.http) = {
      post: "/car-parking/v1/parking-lots/{parking_lot_id}:unfavorite"
      body: "*"
    };
  }

  // ListFavoriteParkingLots lists the caller's favorite parking lots, newest
  // favorite first.
  rpc ListFavoriteParkingLots(ListFavoriteParkingLotsRequest) returns (ListFavoriteParkingLotsResponse) {
    option (google.api.http) = {get: "/car-parking/v1/favorites/parking-lots"};
  }

  // ReportParkingLotOutdated reports that an approved parking lot's
  // information is outdated. Each user can report a lot once; reports demote
  // the lot in nearby listings and surface a warning to other users.
  rpc ReportParkingLotOutdated(ReportParkingLotOutdatedRequest) returns (ReportParkingLotOutdatedResponse) {
    option (google.api.http) = {
      post: "/car-parking/v1/parking-lots/{parking_lot_id}:report-outdated"
      body: "*"
    };
  }

  // ListOutdatedReports lists parking lots with outstanding outdated reports
  // so admins can verify and resolve them. Admin only.
  rpc ListOutdatedReports(ListOutdatedReportsRequest) returns (ListOutdatedReportsResponse) {
    option (google.api.http) = {get: "/car-parking/v1/admin/outdated-reports"};
  }
}

// PingRequest is the input to Ping.
message PingRequest {}

// PingResponse is the output of Ping.
message PingResponse {
  // message is a liveness message.
  string message = 1;
}

// ParkingLotStatus is the lifecycle state of a parking lot.
enum ParkingLotStatus {
  // PARKING_LOT_STATUS_UNSPECIFIED is the default value; it is never used for
  // a real parking lot.
  PARKING_LOT_STATUS_UNSPECIFIED = 0;
  // PARKING_LOT_STATUS_PENDING_REVIEW means the lot was submitted and awaits
  // review.
  PARKING_LOT_STATUS_PENDING_REVIEW = 1;
  // PARKING_LOT_STATUS_APPROVED means the lot passed review and is publicly
  // visible.
  PARKING_LOT_STATUS_APPROVED = 2;
  // PARKING_LOT_STATUS_REJECTED means the lot was rejected and is only visible
  // to its submitter.
  PARKING_LOT_STATUS_REJECTED = 3;
  // PARKING_LOT_STATUS_DISABLED means the lot was taken offline (closed,
  // verified as outdated, or moderated). It no longer appears in public
  // discovery; it remains visible to its submitter and to users who favorited
  // it.
  PARKING_LOT_STATUS_DISABLED = 4;
}

// ReviewDecision is the reviewer's decision for a pending submission.
enum ReviewDecision {
  // REVIEW_DECISION_UNSPECIFIED is the default value; it is never used for a
  // real decision.
  REVIEW_DECISION_UNSPECIFIED = 0;
  // REVIEW_DECISION_APPROVE publishes the submission.
  REVIEW_DECISION_APPROVE = 1;
  // REVIEW_DECISION_REJECT rejects the submission; review_comment is
  // required.
  REVIEW_DECISION_REJECT = 2;
}

// ParkingLot is the domain entity of a parking lot: immutable facts plus
// server-maintained state. Per-request view data (distance, per-caller flags)
// lives in ParkingLotView instead.
message ParkingLot {
  // id is the stable identifier of the parking lot.
  string id = 1;
  // name is the display name of the parking lot.
  string name = 2;
  // address is the human-readable location description of the parking lot.
  string address = 3;
  // latitude is the WGS-84 latitude of the parking lot entrance.
  double latitude = 4;
  // longitude is the WGS-84 longitude of the parking lot entrance.
  double longitude = 5;
  // cover_image_url points to the cover image of the parking lot.
  string cover_image_url = 6;
  // price_image_urls point to images showing the pricing and charging rules.
  repeated string price_image_urls = 7;
  // payment_qr_image_urls point to payment QR code images accepted at the lot.
  repeated string payment_qr_image_urls = 8;
  // status is the current lifecycle state of the parking lot.
  ParkingLotStatus status = 9;
  // review_comment explains a rejection; empty for approved and pending lots.
  string review_comment = 10;
  // submitter_id is the user who uploaded this parking lot.
  string submitter_id = 11;
  // created_at is when the parking lot was created.
  google.protobuf.Timestamp created_at = 12;
  // updated_at is when the parking lot was last updated. Updating a disabled
  // or approved lot's content is not allowed; a resubmitted lot's content
  // update also refreshes this timestamp.
  google.protobuf.Timestamp updated_at = 13;
  // outdated_report_count is the number of users that reported this lot as
  // outdated. It resets to zero when the submitter updates the content.
  int32 outdated_report_count = 14;
  // city is the city where the parking lot is located; every address is
  // required to carry one so the mini program can filter its local cache to
  // the user's current city without a server round-trip.
  string city = 15;
}

// ParkingLotView wraps a parking lot with request-context data: distance from
// the caller's location and per-caller flags. It is the response payload for
// discovery and list RPCs; the wrapped ParkingLot carries domain fields only.
message ParkingLotView {
  // parking_lot is the parking lot entity.
  ParkingLot parking_lot = 1;
  // distance_m is the distance from the caller's location; only set for
  // nearby-list responses.
  double distance_m = 2;
  // flagged_outdated is true when the lot has at least one outdated report;
  // the frontend shows a "verify before use" hint when set.
  bool flagged_outdated = 3;
  // favorited_by_me is true when the caller has favorited this lot.
  bool favorited_by_me = 4;
  // outdated_reported_by_me is true when the caller already reported this lot
  // as outdated.
  bool outdated_reported_by_me = 5;
  // owned_by_me is true when the caller submitted this parking lot; the
  // frontend uses it to offer edit/remove actions on the caller's own lots.
  bool owned_by_me = 6;
}

// ParkingLotDraft is the user-editable content of a parking lot, used when
// creating or updating a submission.
message ParkingLotDraft {
  // name is the display name of the parking lot. Required.
  string name = 1;
  // address is the human-readable location description. Required.
  string address = 2;
  // latitude is the WGS-84 latitude of the parking lot entrance. Required.
  double latitude = 3;
  // longitude is the WGS-84 longitude of the parking lot entrance. Required.
  double longitude = 4;
  // cover_image_url is an optional cover image.
  string cover_image_url = 5;
  // price_image_urls point to images showing the pricing and charging rules.
  // Optional; at least one of price_image_urls and payment_qr_image_urls is
  // required.
  repeated string price_image_urls = 6;
  // payment_qr_image_urls point to payment QR code images accepted at the lot.
  // Optional; at least one of price_image_urls and payment_qr_image_urls is
  // required.
  repeated string payment_qr_image_urls = 7;
  // city is the city where the parking lot is located. Required.
  string city = 8;
}

// ListNearbyParkingLotsRequest is the input to ListNearbyParkingLots.
message ListNearbyParkingLotsRequest {
  // latitude is the caller's WGS-84 latitude used as the search anchor.
  // Required.
  double latitude = 1;
  // longitude is the caller's WGS-84 longitude used as the search anchor.
  // Required.
  double longitude = 2;
  // pagination controls page size and continuation.
  kobecal.miniprogram.common.v1.Pagination pagination = 3;
  // radius_m bounds the search to parking lots within this many meters of the
  // anchor. Zero means "use the server default" (5000 m). Values are clamped
  // to the supported range [100, 50000]. This lets the mini program scope a
  // nearby search to its current city without a server round-trip.
  optional double radius_m = 4;
}

// ListNearbyParkingLotsResponse is the output of ListNearbyParkingLots.
message ListNearbyParkingLotsResponse {
  // parking_lots is the page of nearby lots sorted by distance, with lots
  // that have outdated reports demoted.
  repeated ParkingLotView parking_lots = 1;
  // page_info carries pagination metadata.
  kobecal.miniprogram.common.v1.PageInfo page_info = 2;
}

// CheckCachedParkingLotsRequest carries the client's cache snapshot.
message CheckCachedParkingLotsRequest {
  // cached_lots is the client's cached lots (id + last-known updated_at).
  // At most 200 refs are accepted; extra refs are dropped.
  repeated CachedParkingLot cached_lots = 1;
}

// CachedParkingLot is one entry of the client's local cache snapshot.
message CachedParkingLot {
  // parking_lot_id is the cached lot's id. Required.
  string parking_lot_id = 1;
  // updated_at is the cached lot's last-known updated_at. Required.
  google.protobuf.Timestamp updated_at = 2;
}

// CheckCachedParkingLotsResponse is the output of CheckCachedParkingLots.
message CheckCachedParkingLotsResponse {
  // stale_parking_lot_ids lists the cached lot ids whose copy is no longer
  // current: the lot no longer exists, or its updated_at differs from the
  // client's snapshot. Lots not listed are still current and can be kept.
  repeated string stale_parking_lot_ids = 1;
}

// ReverseGeocodeRequest is the input to ReverseGeocode.
message ReverseGeocodeRequest {
  // latitude is the WGS-84 latitude of the query point. Required.
  double latitude = 1;
  // longitude is the WGS-84 longitude of the query point. Required.
  double longitude = 2;
}

// ReverseGeocodeResponse is the output of ReverseGeocode.
message ReverseGeocodeResponse {
  // name is a nearby POI / place name suggested for the parking lot.
  string name = 1;
  // address is the human-readable address of the query point.
  string address = 2;
  // city is the city the query point belongs to.
  string city = 3;
}

// GetParkingLotRequest is the input to GetParkingLot.
message GetParkingLotRequest {
  // parking_lot_id is the identifier of the lot to fetch. Required.
  string parking_lot_id = 1;
}

// GetParkingLotResponse is the output of GetParkingLot.
message GetParkingLotResponse {
  // parking_lot is the requested parking lot view. distance_m is unset.
  ParkingLotView parking_lot = 1;
}

// CreateParkingLotRequest is the input to CreateParkingLot.
message CreateParkingLotRequest {
  // parking_lot is the draft content of the new lot. Required.
  ParkingLotDraft parking_lot = 1;
}

// CreateParkingLotResponse is the output of CreateParkingLot.
message CreateParkingLotResponse {
  // parking_lot is the created lot in PENDING_REVIEW state.
  ParkingLot parking_lot = 1;
}

// UpdateParkingLotRequest is the input to UpdateParkingLot.
message UpdateParkingLotRequest {
  // parking_lot_id is the identifier of the lot to update. Required.
  string parking_lot_id = 1;
  // parking_lot is the replacement draft content. Required.
  ParkingLotDraft parking_lot = 2;
}

// UpdateParkingLotResponse is the output of UpdateParkingLot.
message UpdateParkingLotResponse {
  // parking_lot is the updated lot, resubmitted for review with its
  // outdated_report_count reset.
  ParkingLot parking_lot = 1;
}

// DeleteParkingLotRequest is the input to DeleteParkingLot.
message DeleteParkingLotRequest {
  // parking_lot_id is the identifier of the lot to delete. Required.
  string parking_lot_id = 1;
}

// DeleteParkingLotResponse is the output of DeleteParkingLot.
message DeleteParkingLotResponse {}

// ListMyParkingLotsRequest is the input to ListMyParkingLots.
message ListMyParkingLotsRequest {
  // pagination controls page size and continuation.
  kobecal.miniprogram.common.v1.Pagination pagination = 1;
}

// ListMyParkingLotsResponse is the output of ListMyParkingLots.
message ListMyParkingLotsResponse {
  // parking_lots is the caller's submissions, newest first.
  repeated ParkingLotView parking_lots = 1;
  // page_info carries pagination metadata.
  kobecal.miniprogram.common.v1.PageInfo page_info = 2;
}

// ListParkingLotsForReviewRequest is the input to ListParkingLotsForReview.
message ListParkingLotsForReviewRequest {
  // status filters the queue by lifecycle state. Unspecified means
  // PENDING_REVIEW, the default queue view.
  ParkingLotStatus status = 1;
  // pagination controls page size and continuation.
  kobecal.miniprogram.common.v1.Pagination pagination = 2;
}

// ListParkingLotsForReviewResponse is the output of ListParkingLotsForReview.
message ListParkingLotsForReviewResponse {
  // parking_lots is the review queue page, newest first.
  repeated ParkingLot parking_lots = 1;
  // page_info carries pagination metadata.
  kobecal.miniprogram.common.v1.PageInfo page_info = 2;
}

// ReviewParkingLotRequest is the input to ReviewParkingLot. Admin only.
message ReviewParkingLotRequest {
  // parking_lot_id is the identifier of the lot to review. Required.
  string parking_lot_id = 1;
  // decision is the reviewer decision; APPROVE or REJECT. Required.
  ReviewDecision decision = 2;
  // review_comment explains the decision and is required for rejection.
  string review_comment = 3;
}

// ReviewParkingLotResponse is the output of ReviewParkingLot.
message ReviewParkingLotResponse {
  // parking_lot is the lot with the updated review state.
  ParkingLot parking_lot = 1;
}

// FavoriteParkingLotRequest is the input to FavoriteParkingLot.
message FavoriteParkingLotRequest {
  // parking_lot_id is the identifier of the lot to favorite. Required.
  string parking_lot_id = 1;
}

// FavoriteParkingLotResponse is the output of FavoriteParkingLot.
message FavoriteParkingLotResponse {
  // favorited is true when the lot is favorited by the caller after this
  // call; repeated favorites are idempotent.
  bool favorited = 1;
}

// UnfavoriteParkingLotRequest is the input to UnfavoriteParkingLot.
message UnfavoriteParkingLotRequest {
  // parking_lot_id is the identifier of the lot to unfavorite. Required.
  string parking_lot_id = 1;
}

// UnfavoriteParkingLotResponse is the output of UnfavoriteParkingLot.
message UnfavoriteParkingLotResponse {}

// ListFavoriteParkingLotsRequest is the input to ListFavoriteParkingLots.
message ListFavoriteParkingLotsRequest {
  // pagination controls page size and continuation.
  kobecal.miniprogram.common.v1.Pagination pagination = 1;
}

// ListFavoriteParkingLotsResponse is the output of ListFavoriteParkingLots.
message ListFavoriteParkingLotsResponse {
  // parking_lots is the caller's favorite lots, newest favorite first.
  repeated ParkingLotView parking_lots = 1;
  // page_info carries pagination metadata.
  kobecal.miniprogram.common.v1.PageInfo page_info = 2;
}

// ReportParkingLotOutdatedRequest is the input to ReportParkingLotOutdated.
message ReportParkingLotOutdatedRequest {
  // parking_lot_id is the identifier of the lot being reported. Required.
  string parking_lot_id = 1;
}

// ReportParkingLotOutdatedResponse is the output of
// ReportParkingLotOutdated.
message ReportParkingLotOutdatedResponse {
  // already_reported is true when the caller had already reported this lot;
  // repeat reports do not increment the count.
  bool already_reported = 1;
  // outdated_report_count is the updated report count.
  int32 outdated_report_count = 2;
}

// ListOutdatedReportsRequest is the input to ListOutdatedReports. Admin only.
message ListOutdatedReportsRequest {
  // pagination controls page size and continuation.
  kobecal.miniprogram.common.v1.Pagination pagination = 1;
}

// ListOutdatedReportsResponse is the output of ListOutdatedReports.
message ListOutdatedReportsResponse {
  // outdated_reports is the page of outstanding reports, newest first.
  repeated OutdatedReport outdated_reports = 1;
  // page_info carries pagination metadata.
  kobecal.miniprogram.common.v1.PageInfo page_info = 2;
}

// OutdatedReport is one outstanding outdated-information report on a parking
// lot.
message OutdatedReport {
  // parking_lot is the reported lot.
  ParkingLot parking_lot = 1;
  // reporter_id is the user who submitted the report.
  string reporter_id = 2;
  // reported_at is when the report was submitted.
  google.protobuf.Timestamp reported_at = 3;
}
