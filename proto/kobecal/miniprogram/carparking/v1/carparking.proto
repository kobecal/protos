// CarParkingService is the front-door contract for the car-parking mini
// program backend (parking lot discovery, favorites, submissions with a
// review flow, and outdated-information reporting).
syntax = "proto3";

package kobecal.miniprogram.carparking.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "kobecal/miniprogram/common/v1/common.proto";

option go_package = "github.com/kobecal/protos/gen/go/miniprogram/carparking/v1;carparkingv1";

// CarParkingService exposes parking lot discovery, favorites, user-submitted
// lots with a review flow, and outdated-information reporting.
service CarParkingService {
  // Ping returns a liveness response.
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {get: "/v1/ping"};
  }

  // ListNearbyParkingLots returns approved parking lots near the caller's
  // location, sorted by distance. Lots with outdated reports are demoted.
  rpc ListNearbyParkingLots(ListNearbyParkingLotsRequest) returns (ListNearbyParkingLotsResponse) {
    option (google.api.http) = {get: "/v1/parking-lots"};
  }

  // GetParkingLot returns one parking lot. Pending and rejected lots are only
  // visible to their submitter (and reviewers).
  rpc GetParkingLot(GetParkingLotRequest) returns (GetParkingLotResponse) {
    option (google.api.http) = {get: "/v1/parking-lots/{parking_lot_id}"};
  }

  // CreateParkingLot submits a new parking lot for review. The lot is only
  // visible to the submitter until a reviewer approves it.
  rpc CreateParkingLot(CreateParkingLotRequest) returns (CreateParkingLotResponse) {
    option (google.api.http) = {
      post: "/v1/parking-lots"
      body: "*"
    };
  }

  // UpdateParkingLot updates a parking lot owned by the caller. Only pending
  // or rejected lots can be edited; editing resubmits the lot for review.
  rpc UpdateParkingLot(UpdateParkingLotRequest) returns (UpdateParkingLotResponse) {
    option (google.api.http) = {
      patch: "/v1/parking-lots/{parking_lot_id}"
      body: "*"
    };
  }

  // ListMyParkingLots lists the caller's submissions, including lots awaiting
  // review or rejected.
  rpc ListMyParkingLots(ListMyParkingLotsRequest) returns (ListMyParkingLotsResponse) {
    option (google.api.http) = {get: "/v1/my/parking-lots"};
  }

  // ReviewParkingLot approves or rejects a pending submission. Admin only.
  rpc ReviewParkingLot(ReviewParkingLotRequest) returns (ReviewParkingLotResponse) {
    option (google.api.http) = {
      post: "/v1/parking-lots/{parking_lot_id}:review"
      body: "*"
    };
  }

  // FavoriteParkingLot adds an approved parking lot to the caller's favorites.
  rpc FavoriteParkingLot(FavoriteParkingLotRequest) returns (FavoriteParkingLotResponse) {
    option (google.api.http) = {
      post: "/v1/parking-lots/{parking_lot_id}:favorite"
      body: "*"
    };
  }

  // UnfavoriteParkingLot removes a parking lot from the caller's favorites.
  rpc UnfavoriteParkingLot(UnfavoriteParkingLotRequest) returns (UnfavoriteParkingLotResponse) {
    option (google.api.http) = {
      post: "/v1/parking-lots/{parking_lot_id}:unfavorite"
      body: "*"
    };
  }

  // ListFavoriteParkingLots lists the caller's favorite parking lots, newest
  // favorite first.
  rpc ListFavoriteParkingLots(ListFavoriteParkingLotsRequest) returns (ListFavoriteParkingLotsResponse) {
    option (google.api.http) = {get: "/v1/favorites/parking-lots"};
  }

  // ReportParkingLotOutdated reports that an approved parking lot's
  // information is outdated. Each user can report a lot once; reports demote
  // the lot in nearby listings and surface a warning to other users.
  rpc ReportParkingLotOutdated(ReportParkingLotOutdatedRequest) returns (ReportParkingLotOutdatedResponse) {
    option (google.api.http) = {
      post: "/v1/parking-lots/{parking_lot_id}:report-outdated"
      body: "*"
    };
  }
}

// PingRequest is the input to Ping.
message PingRequest {}

// PingResponse is the output of Ping.
message PingResponse {
  // message is a liveness message.
  string message = 1;
}

// ParkingLotStatus is the review state of a parking lot.
enum ParkingLotStatus {
  // PARKING_LOT_STATUS_UNSPECIFIED is the default value; it is never used for
  // a real parking lot.
  PARKING_LOT_STATUS_UNSPECIFIED = 0;
  // PARKING_LOT_STATUS_PENDING_REVIEW means the lot was submitted and awaits
  // review.
  PARKING_LOT_STATUS_PENDING_REVIEW = 1;
  // PARKING_LOT_STATUS_APPROVED means the lot passed review and is publicly
  // visible.
  PARKING_LOT_STATUS_APPROVED = 2;
  // PARKING_LOT_STATUS_REJECTED means the lot was rejected and is only visible
  // to its submitter.
  PARKING_LOT_STATUS_REJECTED = 3;
}

// ParkingLot is a parking lot that can be discovered, favorited, and reviewed.
message ParkingLot {
  // id is the stable identifier of the parking lot.
  string id = 1;
  // name is the display name of the parking lot.
  string name = 2;
  // address is the human-readable location description of the parking lot.
  string address = 3;
  // latitude is the WGS-84 latitude of the parking lot entrance.
  double latitude = 4;
  // longitude is the WGS-84 longitude of the parking lot entrance.
  double longitude = 5;
  // cover_image_url points to the cover image of the parking lot.
  string cover_image_url = 6;
  // price_image_urls point to images showing the pricing and charging rules.
  repeated string price_image_urls = 7;
  // payment_qr_image_urls point to payment QR code images accepted at the lot.
  repeated string payment_qr_image_urls = 8;
  // status is the current review state of the parking lot.
  ParkingLotStatus status = 9;
  // review_comment explains a rejection; empty for approved and pending lots.
  string review_comment = 10;
  // submitter_id is the user who uploaded this parking lot.
  string submitter_id = 11;
  // created_at is when the parking lot was created.
  google.protobuf.Timestamp created_at = 12;
  // updated_at is when the parking lot was last updated.
  google.protobuf.Timestamp updated_at = 13;
  // outdated_report_count is the number of users that reported this lot as
  // outdated.
  int32 outdated_report_count = 14;
  // flagged_outdated is true when the lot has at least one outdated report;
  // the frontend shows a "verify before use" hint when set.
  bool flagged_outdated = 15;
  // outdated_reported_by_me is true when the caller already reported this lot
  // as outdated.
  bool outdated_reported_by_me = 16;
  // favorited_by_me is true when the caller has favorited this lot.
  bool favorited_by_me = 17;
  // distance_m is the distance from the caller's location; only set in nearby
  // list responses.
  double distance_m = 18;
}

// ParkingLotDraft is the user-editable content of a parking lot, used when
// creating or updating a submission.
message ParkingLotDraft {
  // name is the display name of the parking lot. Required.
  string name = 1;
  // address is the human-readable location description. Required.
  string address = 2;
  // latitude is the WGS-84 latitude of the parking lot entrance. Required.
  double latitude = 3;
  // longitude is the WGS-84 longitude of the parking lot entrance. Required.
  double longitude = 4;
  // cover_image_url is an optional cover image.
  string cover_image_url = 5;
  // price_image_urls point to images showing the pricing and charging rules.
  // At least one is required.
  repeated string price_image_urls = 6;
  // payment_qr_image_urls point to payment QR code images accepted at the lot.
  // At least one is required.
  repeated string payment_qr_image_urls = 7;
}

// ListNearbyParkingLotsRequest is the input to ListNearbyParkingLots.
message ListNearbyParkingLotsRequest {
  // latitude is the caller's WGS-84 latitude used as the search anchor.
  // Required.
  double latitude = 1;
  // longitude is the caller's WGS-84 longitude used as the search anchor.
  // Required.
  double longitude = 2;
  // pagination controls page size and continuation.
  kobecal.miniprogram.common.v1.Pagination pagination = 3;
}

// ListNearbyParkingLotsResponse is the output of ListNearbyParkingLots.
message ListNearbyParkingLotsResponse {
  // parking_lots is the page of nearby lots sorted by distance, with lots
  // that have outdated reports demoted.
  repeated ParkingLot parking_lots = 1;
  // page_info carries pagination metadata.
  kobecal.miniprogram.common.v1.PageInfo page_info = 2;
}

// GetParkingLotRequest is the input to GetParkingLot.
message GetParkingLotRequest {
  // parking_lot_id is the identifier of the lot to fetch. Required.
  string parking_lot_id = 1;
}

// GetParkingLotResponse is the output of GetParkingLot.
message GetParkingLotResponse {
  // parking_lot is the requested parking lot.
  ParkingLot parking_lot = 1;
}

// CreateParkingLotRequest is the input to CreateParkingLot.
message CreateParkingLotRequest {
  // parking_lot is the draft content of the new lot. Required.
  ParkingLotDraft parking_lot = 1;
}

// CreateParkingLotResponse is the output of CreateParkingLot.
message CreateParkingLotResponse {
  // parking_lot is the created lot in PENDING_REVIEW state.
  ParkingLot parking_lot = 1;
}

// UpdateParkingLotRequest is the input to UpdateParkingLot.
message UpdateParkingLotRequest {
  // parking_lot_id is the identifier of the lot to update. Required.
  string parking_lot_id = 1;
  // parking_lot is the replacement draft content. Required.
  ParkingLotDraft parking_lot = 2;
}

// UpdateParkingLotResponse is the output of UpdateParkingLot.
message UpdateParkingLotResponse {
  // parking_lot is the updated lot, resubmitted for review.
  ParkingLot parking_lot = 1;
}

// ListMyParkingLotsRequest is the input to ListMyParkingLots.
message ListMyParkingLotsRequest {
  // pagination controls page size and continuation.
  kobecal.miniprogram.common.v1.Pagination pagination = 1;
}

// ListMyParkingLotsResponse is the output of ListMyParkingLots.
message ListMyParkingLotsResponse {
  // parking_lots is the caller's submissions, newest first.
  repeated ParkingLot parking_lots = 1;
  // page_info carries pagination metadata.
  kobecal.miniprogram.common.v1.PageInfo page_info = 2;
}

// ReviewParkingLotRequest is the input to ReviewParkingLot. Admin only.
message ReviewParkingLotRequest {
  // parking_lot_id is the identifier of the lot to review. Required.
  string parking_lot_id = 1;
  // status is the reviewer decision; APPROVED or REJECTED. Required.
  ParkingLotStatus status = 2;
  // review_comment explains the decision and is required for rejection.
  string review_comment = 3;
}

// ReviewParkingLotResponse is the output of ReviewParkingLot.
message ReviewParkingLotResponse {
  // parking_lot is the lot with the updated review state.
  ParkingLot parking_lot = 1;
}

// FavoriteParkingLotRequest is the input to FavoriteParkingLot.
message FavoriteParkingLotRequest {
  // parking_lot_id is the identifier of the lot to favorite. Required.
  string parking_lot_id = 1;
}

// FavoriteParkingLotResponse is the output of FavoriteParkingLot.
message FavoriteParkingLotResponse {
  // parking_lot is the favorited lot.
  ParkingLot parking_lot = 1;
}

// UnfavoriteParkingLotRequest is the input to UnfavoriteParkingLot.
message UnfavoriteParkingLotRequest {
  // parking_lot_id is the identifier of the lot to unfavorite. Required.
  string parking_lot_id = 1;
}

// UnfavoriteParkingLotResponse is the output of UnfavoriteParkingLot.
message UnfavoriteParkingLotResponse {}

// ListFavoriteParkingLotsRequest is the input to ListFavoriteParkingLots.
message ListFavoriteParkingLotsRequest {
  // pagination controls page size and continuation.
  kobecal.miniprogram.common.v1.Pagination pagination = 1;
}

// ListFavoriteParkingLotsResponse is the output of
// ListFavoriteParkingLots.
message ListFavoriteParkingLotsResponse {
  // parking_lots is the caller's favorite lots, newest favorite first.
  repeated ParkingLot parking_lots = 1;
  // page_info carries pagination metadata.
  kobecal.miniprogram.common.v1.PageInfo page_info = 2;
}

// ReportParkingLotOutdatedRequest is the input to
// ReportParkingLotOutdated.
message ReportParkingLotOutdatedRequest {
  // parking_lot_id is the identifier of the lot being reported. Required.
  string parking_lot_id = 1;
}

// ReportParkingLotOutdatedResponse is the output of
// ReportParkingLotOutdated.
message ReportParkingLotOutdatedResponse {
  // parking_lot is the updated lot; outdated_report_count and
  // flagged_outdated reflect the report.
  ParkingLot parking_lot = 1;
}
