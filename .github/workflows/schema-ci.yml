name: schema

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SCHEMA_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-action@e8b15693be91ae73e965d157c722987338c768b3 # v1
        with:
          version: "1.72.0"
          checksum: "8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af"
          setup_only: true
          pr_comment: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install Go schema generator
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Install OpenAPI schema generator
        run: go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.29.0

      - name: Verify schemas
        run: make verify

      - name: Verify generated schema artifacts
        run: make generated-check
