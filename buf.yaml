version: v2

modules:
  - path: proto

deps:
  - buf.build/googleapis/googleapis

lint:
  use:
    - STANDARD

breaking:
  use:
    - PACKAGE
  # One-time namespace migration (contracts → miniprogram): the old package
  # tree was removed in the same commit that added its miniprogram equivalent,
  # so buf's PACKAGE_NO_DELETE must be waived for the legacy paths.
  ignore:
    - proto/kobecal/contracts
    # Deliberate retirement: miniprogram/agent was unused by any consumer and
    # was removed from the repository.
    - proto/kobecal/miniprogram/agent
